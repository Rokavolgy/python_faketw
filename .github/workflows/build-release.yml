name: Build release archives

on:
  workflow_dispatch:
    inputs:
      run_tests:
        description: Run the test suite before packaging
        required: true
        type: boolean
        default: true

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"
  QT_QPA_PLATFORM: offscreen

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows x64
            runner: windows-latest
            requirements: requirements.txt
            archive: Fwitter-Windows-x64.zip
          - platform: Linux x64
            runner: ubuntu-24.04
            requirements: requirements_linux.txt
            archive: Fwitter-Linux-x64.zip

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: x64
          cache: pip
          cache-dependency-path: ${{ matrix.requirements }}

      - name: Install Linux build libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            patchelf \
            libegl1 \
            libgl1 \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            zip

      - name: Install application dependencies
        run: python -m pip install --requirement "${{ matrix.requirements }}"

      - name: Run tests
        if: inputs.run_tests
        run: python -m unittest discover -s tests

      - name: Build Windows application
        if: runner.os == 'Windows'
        uses: Nuitka/Nuitka-Action@main
        with:
          script-name: main_window.py
          mode: standalone
          enable-plugins: pyside6
          output-file: Fwitter
          output-dir: build
          windows-console-mode: disable
          include-data-dir: res=res
          include-module: |
            PIL.AvifImagePlugin
            PIL._avif

      - name: Build Linux application
        if: runner.os == 'Linux'
        uses: Nuitka/Nuitka-Action@main
        with:
          script-name: main_window.py
          mode: standalone
          enable-plugins: pyside6
          output-file: Fwitter
          output-dir: build
          include-data-dir: res=res
          include-module: |
            PIL.AvifImagePlugin
            PIL._avif

      - name: Verify AVIF codec in Windows build
        if: runner.os == 'Windows'
        shell: pwsh
        run: build/main_window.dist/Fwitter.exe --check-avif

      - name: Verify AVIF codec in Linux build
        if: runner.os == 'Linux'
        run: build/main_window.dist/Fwitter --check-avif

      - name: Stage Windows application
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Move-Item -LiteralPath build/main_window.dist -Destination package/Fwitter
          Compress-Archive -Path package/Fwitter -DestinationPath "${{ matrix.archive }}"

      - name: Stage Linux application
        if: runner.os == 'Linux'
        run: |
          mkdir -p package
          mv build/main_window.dist package/Fwitter
          chmod +x package/Fwitter/Fwitter
          (cd package && zip -r "../${{ matrix.archive }}" Fwitter)

      # Direct upload avoids wrapping the release ZIP in another artifact ZIP.
      - name: Upload release archive
        uses: actions/upload-artifact@v7
        with:
          path: ${{ matrix.archive }}
          archive: false
          if-no-files-found: error
          retention-days: 14
